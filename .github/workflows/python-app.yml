name: Python application

on:
  pull_request:
    branches: [ "master" ]
  push:
    branches: [ "master" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    if: '! github.event.pull_request.draft'
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: false
      matrix:
        python-version: [ "3.9", "3.10", "3.11", "3.12", "3.13", "3.14" ]
        os: [ ubuntu-latest, macos-latest, windows-latest ]
        # ubuntu-latest (26.04) has no prebuilt Python 3.9; keep covering it on 24.04.
        exclude:
          - python-version: "3.9"
            os: ubuntu-latest
        include:
          - python-version: "3.9"
            os: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -U '.[test]' pre-commit
      - name: Run pre-commit hooks
        run: pre-commit run --all-files
      - name: Test
        run: python -m pytest

  pyright:
    if: '! github.event.pull_request.draft'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v7
      - name: Type check
        run: |
          uv venv
          uv pip install '.[test]'
          uvx pyright@1.1.411
