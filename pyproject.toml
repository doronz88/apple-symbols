[project]
name = "apple-symbols"
description = "Symbolicate addresses of Apple devices using Xcode DeviceSupport symbols and kernelcaches"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["ios", "macos", "symbolication", "symbols", "dyld-shared-cache", "kernelcache", "mach-o"]
authors = [
    { name = "doronz88", email = "doron88@gmail.com" }
]
maintainers = [
    { name = "doronz88", email = "doron88@gmail.com" }
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3 :: Only",
]
dependencies = ["bytestruct>=0.2.0"]
dynamic = ["version"]

[project.optional-dependencies]
test = ["pytest", "symbolicator-server>=0.6.0"]
remote = ["symbolicator-server>=0.6.0"]

[project.urls]
"Homepage" = "https://github.com/doronz88/apple-symbols"
"Bug Reports" = "https://github.com/doronz88/apple-symbols/issues"

[tool.setuptools.packages.find]
exclude = ["docs*", "tests*"]

[tool.setuptools.package-data]
apple_symbols = ["py.typed"]

[tool.setuptools.dynamic]
version = { attr = "apple_symbols._version.__version__" }

[tool.setuptools_scm]
version_file = "apple_symbols/_version.py"

[build-system]
requires = ["setuptools>=77.0.3", "setuptools_scm>=8", "wheel"]
build-backend = "setuptools.build_meta"

[tool.ruff]
target-version = "py39"
line-length = 120

[tool.ruff.lint]
select = ["YTT", "B", "A", "C4", "T10", "SIM", "I", "E", "W", "F", "PGH", "UP", "RUF", "TRY"]
ignore = ["E501", "TRY003", "TRY400", "TRY301", "UP007", "UP045"]

[tool.ruff.format]
preview = true

[tool.pyright]
pythonVersion = "3.9"
typeCheckingMode = "strict"
include = ["apple_symbols"]
venvPath = "."
venv = ".venv"
